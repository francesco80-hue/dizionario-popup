name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Italian dictionary source
        run: |
          mkdir -p build-data
          curl -L --fail --retry 3 https://kaikki.org/itwiktionary/raw-wiktextract-data.jsonl.gz -o build-data/itwiktionary.jsonl.gz
      - name: Build compact offline dictionary
        run: python3 tools/build_dictionary.py
      - name: Publish current dictionary database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p updates
          gzip -c app/src/main/assets/dictionary.db > updates/dictionary.db.gz
          cat > updates/dictionary-manifest.json <<EOF
          {
            "version": "${GITHUB_RUN_NUMBER}",
            "url": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/updates/dictionary.db.gz"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/dictionary.db.gz updates/dictionary-manifest.json
          git commit -m "Publish offline dictionary database ${GITHUB_RUN_NUMBER}" || exit 0
          git push origin HEAD:main
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DizionarioPopup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check stable signing configuration
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_KEYSTORE_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare stable signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
      - name: Build stable signed APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Upload stable signed APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DizionarioPopup-stable-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
