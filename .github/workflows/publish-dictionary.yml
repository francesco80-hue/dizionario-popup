name: Publish dictionary database

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 14 * *'

permissions:
  contents: write

jobs:
  dictionary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Italian dictionary source
        run: |
          mkdir -p build-data
          curl -L --fail --retry 3 https://kaikki.org/itwiktionary/raw-wiktextract-data.jsonl.gz -o build-data/itwiktionary.jsonl.gz
      - name: Build offline dictionary database
        run: python3 tools/build_dictionary.py
      - name: Validate database
        run: |
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect("app/src/main/assets/dictionary.db")
          count = db.execute("SELECT COUNT(*) FROM entries").fetchone()[0]
          assert count > 1000, f"Database unexpectedly small: {count}"
          assert db.execute("SELECT COUNT(*) FROM entries WHERE word_key='sacrificare'").fetchone()[0] == 1
          print(f"Validated {count} dictionary entries")
          db.close()
          PY
      - name: Publish compressed dictionary update
        run: |
          mkdir -p updates
          gzip -c app/src/main/assets/dictionary.db > updates/dictionary.db.gz
          cat > updates/dictionary-manifest.json <<EOF
          {
            "version": "scheduled-${GITHUB_RUN_NUMBER}",
            "url": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/updates/dictionary.db.gz"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/dictionary.db.gz updates/dictionary-manifest.json
          git commit -m "Publish scheduled dictionary update ${GITHUB_RUN_NUMBER}" || exit 0
          git push origin HEAD:main
